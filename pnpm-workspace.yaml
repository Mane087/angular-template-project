packages:
  - "."

# =========================================================
# Seguridad: scripts de instalación
# =========================================================

ignoreScripts: false
enablePrePostScripts: false
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds: { '@parcel/watcher': true, esbuild: true, lmdb: false, msgpackr-extract: false, unrs-resolver: false }

# =========================================================
# Seguridad: estabilidad contra paquetes recién publicados
# =========================================================

minimumReleaseAge: 1440
minimumReleaseAgeExclude: []

# =========================================================
# Seguridad: resolución estricta
# =========================================================

strictPeerDependencies: true
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: true

# =========================================================
# Optimización / consistencia
# =========================================================

lockfile: true
sharedWorkspaceLockfile: true
dedupePeerDependents: true
preferOffline: true
reporter: append-only

# =========================================================
# Gestión del package manager
# =========================================================

pmOnFail: download
